<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkinSync | Personalized Skincare</title>
    <style>
        :root { --accent: #d4a373; --bg: #fefae0; --text: #333; }
        body { font-family: 'Helvetica Neue', sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; }
        .hero-image { flex: 1; background: url('https://images.unsplash.com/photo-1556228578-0d85b1a4d571?auto=format&fit=crop&q=80') center/cover; }
        .form-section { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: white; }
        .container { width: 350px; text-align: center; }
        h1 { font-weight: 300; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #eee; border-radius: 2px; }
        button { background: #2c2c2c; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; letter-spacing: 2px; transition: 0.3s; }
        button:hover { background: var(--accent); }
    </style>
</head>
<body>
    <div class="hero-image"></div>
    <div class="form-section">
        <div class="container">
            <h1>SkinSync</h1>
            <p>Your personalized skin profile starts here.</p>
            <form action="RegisterServlet" method="post">
                <input type="text" name="username" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">CREATE PROFILE</button>
            </form>
        </div>
    </div>
</body>
</html>
